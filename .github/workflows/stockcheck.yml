name: stock-check

on:
  schedule:
    - cron: "*/5 * * * *"   # 5분마다 (GitHub 부하에 따라 몇 분 밀릴 수 있음)
  workflow_dispatch:         # Actions 탭에서 수동 실행 가능
    inputs:
      test_kakao:
        description: "재고와 상관없이 테스트 카톡 보내기"
        type: boolean
        default: false

concurrency:
  group: stock-check
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # 알림 후 이 워크플로를 스스로 비활성화하기 위해 필요

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check stock and notify
        id: check
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python3 stockchecker.py ${{ inputs.test_kakao && '--test-kakao' || '' }}
      - name: Disable workflow after notifying
        if: steps.check.outputs.notified == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable stock-check --repo ${{ github.repository }}
